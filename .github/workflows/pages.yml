# Publishes the static viewer (web/ and data/) to GitHub Pages.
#
# Setup once: repo Settings -> Pages -> Source: "GitHub Actions". Pages on a free GitHub
# account needs a public repository, so the job is skipped (not failed) while the repo is private.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Public repos only (Pages needs it on a free plan), and only the owner can start a deploy. The bot is
    # allowed because add-game starts a deploy itself after committing (that run is recorded as the bot),
    # and add-game is owner-only.
    if: >-
      github.event.repository.private == false &&
      (github.triggering_actor == github.repository_owner || github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r web data _site/
          cp index.html _site/
          touch _site/.nojekyll
          # Pages lets browsers reuse files for 10 minutes, so a reload right after a deploy could pair
          # the new page with the previous deploy's scripts. Stamp every script/stylesheet URL with this
          # commit so each deploy's files only ever load together.
          V="${GITHUB_SHA::10}"
          cd _site/web
          sed -E -i.bak "s#(from \"\./[A-Za-z]+\.js)\"#\1?v=${V}\"#" ./*.js
          sed -E -i.bak "s#(src=\"app\.js)\"#\1?v=${V}\"#; s#(href=\"style\.css)\"#\1?v=${V}\"#" index.html
          rm -f ./*.bak
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
